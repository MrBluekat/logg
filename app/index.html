<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Arrangementslogg</title>
<meta name="theme-color" content="#0F1620" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="screen-login">
  <img src="icons/icon-192.png" class="login-mark" alt="" />
  <h1>Arrangementslogg</h1>
  <p class="sub">Logg inn for å se logg og oppgaver</p>

  <form id="login-form">
    <div class="field">
      <label for="login-email">E-post</label>
      <input type="email" id="login-email" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="login-password">Passord</label>
      <input type="password" id="login-password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn-primary" id="login-btn">Logg inn</button>
    <div id="login-error"></div>
  </form>
</section>

<!-- ===================== APP ===================== -->
<section id="screen-app" class="hidden">

  <header class="app-header">
    <h2 id="header-title">Logg</h2>
    <span class="status-dot" id="status-dot">Tilkoblet</span>
  </header>

  <div id="push-banner" class="hidden">
    <span>Aktiver push-varsler for kritiske hendelser</span>
    <button id="push-enable-btn">Aktiver</button>
  </div>

  <main class="tab-content">

    <!-- LOGG -->
    <div class="tab-panel active" id="tab-logg">
      <div class="list-heading">Siste hendelser</div>
      <ul class="item-list" id="logg-list"></ul>
      <div class="empty-state hidden" id="logg-empty">Ingen hendelser registrert ennå.</div>
    </div>

    <!-- OPPGAVER -->
    <div class="tab-panel" id="tab-oppgaver">
      <div class="list-heading">Oppgaver</div>
      <ul class="item-list" id="oppgaver-list"></ul>
      <div class="empty-state hidden" id="oppgaver-empty">Ingen oppgaver akkurat nå.</div>
    </div>

  </main>

  <button class="fab" id="fab-new" title="Ny hendelse">+</button>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="logg">
      <span class="dot"></span>
      Logg
    </button>
    <button class="tab-btn" data-tab="oppgaver">
      <span class="dot"></span>
      Oppgaver
    </button>
  </nav>
</section>

<!-- ===================== NY HENDELSE (sheet) ===================== -->
<div class="sheet-backdrop hidden" id="new-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>Ny hendelse</h3>
    <form id="new-form">
      <div class="field">
        <label for="new-kategori">Kategori</label>
        <select id="new-kategori">
          <option value="Medisinsk">Medisinsk</option>
          <option value="Bråk">Bråk</option>
          <option value="Tap/funn">Tap/funn</option>
          <option value="Brann">Brann</option>
          <option value="Teknisk">Teknisk</option>
          <option value="Annet">Annet</option>
        </select>
      </div>
      <div class="field">
        <label for="new-alvorlighet">Alvorlighet</label>
        <select id="new-alvorlighet">
          <option value="lav">Lav</option>
          <option value="middels" selected>Middels</option>
          <option value="hoy">Høy</option>
        </select>
      </div>
      <div class="field">
        <label for="new-beskrivelse">Beskrivelse</label>
        <textarea id="new-beskrivelse" placeholder="Hva skjedde?" required></textarea>
      </div>
      <div class="field">
        <label class="photo-input-label" for="new-photo">
          📷 Legg til bilde (valgfritt)
        </label>
        <input type="file" id="new-photo" accept="image/*" capture="environment" class="hidden" />
        <img id="photo-preview" alt="" />
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn-secondary" id="cancel-new">Avbryt</button>
        <button type="submit" class="btn-primary" id="save-new">Lagre hendelse</button>
      </div>
    </form>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
