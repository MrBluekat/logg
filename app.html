<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrangementslogg</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="event-name" id="event-name">–</span>
    <div class="clock" id="clock">--:--:--</div>
    <button class="ghost" onclick="Contacts.open()">📇 <span data-i18n="contact_list">Kontaktliste</span></button>
    <button class="ghost" onclick="Files.open()">📁 <span data-i18n="files">Filer</span></button>
    <div class="topbar-spacer"></div>
    <button class="ghost" onclick="Dashboard.open()">📊 <span data-i18n="dashboard">Dashboard</span></button>
    <div class="lang-theme-toggle">
      <button class="ghost" onclick="Lang.set('no'); rerender()">NO</button>
      <button class="ghost" onclick="Lang.set('en'); rerender()">EN</button>
      <button class="ghost" onclick="Theme.toggle()">☀/☾</button>
    </div>
    <div class="userinfo">
      <strong id="user-fullname">–</strong><br>
      <span id="admin-back-link"></span>
      <button class="ghost" onclick="Auth.logout()" data-i18n="logout">Logg ut</button>
    </div>
  </div>

  <div class="mobile-readonly-notice" id="mobile-notice" data-i18n="mobile_readonly"></div>

  <div class="app-layout">
    <div class="stack">
      <div class="panel desktop-only-write" id="entry-form-panel">
        <div class="panel-body" id="entry-form"></div>
      </div>

      <div class="panel">
        <div class="panel-head" data-i18n="filters">Filter og søk</div>
        <div class="filter-bar" id="filter-bar"></div>
      </div>

      <div id="log-feed"></div>
    </div>

    <div class="stack">
      <div class="panel">
        <div class="panel-head" data-i18n="timers">Tid</div>
        <div class="panel-body">
          <div class="timer-list" id="timer-list"></div>
          <div class="stack" style="margin-top:.7rem; gap:.4rem">
            <div class="row">
              <input id="new-timer-name" placeholder="Navn" style="flex:1">
              <select id="new-timer-type" onchange="updateTimerInputs()">
                <option value="stopwatch" data-i18n="timer_type_stopwatch">Stoppeklokke</option>
                <option value="countdown_duration" data-i18n="timer_type_countdown_duration">Nedtelling (varighet)</option>
                <option value="countdown_to" data-i18n="timer_type_countdown_to">Nedtelling til tidspunkt</option>
              </select>
            </div>
            <div class="row" id="timer-duration-inputs">
              <input id="new-timer-hours" type="number" min="0" placeholder="t" style="width:60px">
              <input id="new-timer-minutes" type="number" min="0" placeholder="min" style="width:60px">
            </div>
            <div class="row hidden" id="timer-target-inputs">
              <input id="new-timer-target" type="datetime-local" style="flex:1">
            </div>
            <button onclick="addTimer()" data-i18n="new_timer">Ny timer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="history-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;z-index:50"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/log.js"></script>
  <script src="js/pdfExport.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/files.js"></script>
  <script>
    function rerender() {
      Lang.apply();
      Log._renderForm(); Log._renderFilters(); Log._renderEntries();
    }
    function updateTimerInputs() {
      const type = document.getElementById("new-timer-type").value;
      document.getElementById("timer-duration-inputs").classList.toggle("hidden", type !== "countdown_duration");
      document.getElementById("timer-target-inputs").classList.toggle("hidden", type !== "countdown_to");
    }
    function addTimer() {
      const name = document.getElementById("new-timer-name").value;
      const type = document.getElementById("new-timer-type").value;
      const hours = parseFloat(document.getElementById("new-timer-hours").value || "0");
      const minutes = parseFloat(document.getElementById("new-timer-minutes").value || "0");
      const target = document.getElementById("new-timer-target").value;
      Timers.add(name, type, { hours, minutes, target });
      document.getElementById("new-timer-name").value = "";
    }

    (async () => {
      await Auth.requireSession();

      // Admin har ikke et fast event_id - de velger arrangement via ?event=... fra adminpanelet.
      const params = new URLSearchParams(window.location.search);
      const eventParam = params.get("event");

      if (Auth.isAdmin()) {
        if (!eventParam) { window.location.href = "admin.html"; return; }
        const { data: ev } = await sb.from("events").select("*").eq("id", eventParam).single();
        if (!ev) { document.body.innerHTML = "<p style='padding:2rem'>Fant ikke arrangementet.</p>"; return; }
        Auth.event = ev;
      }

      if (!Auth.event) { document.body.innerHTML = "<p style='padding:2rem'>Ingen arrangement tilknyttet denne brukeren.</p>"; return; }
      document.getElementById("event-name").textContent = Auth.event.name;
      document.getElementById("user-fullname").textContent = Auth.profile.full_name;
      if (Auth.isAdmin()) {
        document.getElementById("admin-back-link").innerHTML = `<a href="admin.html"><button class="ghost">Til adminpanel</button></a> `;
      }
      Lang.apply();
      Clock.start("clock");
      Timers.init("timer-list");
      updateTimerInputs();
      await Log.init();
      if (!Auth.canWrite()) document.getElementById("entry-form-panel").classList.add("hidden");
    })();
  </script>
</body>
</html>
